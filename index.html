<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Portfolio Briefcase</title>
<link rel="stylesheet" href="eppn-common.css">
<style>
  /* Landing (logged out) */
  .hero {
    text-align: center;
    padding: 60px 16px 20px;
  }
  .hero h1 {
    font-size: 34px;
    margin: 0 0 10px;
    color: var(--navy-900);
  }
  .hero .slogan {
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 36px;
  }
  .hero .eppn-btn { max-width: 280px; margin: 0 auto; display: block; }
  .hero .login-hint {
    display: block;
    margin-top: 18px;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  /* Dashboard (logged in) */
  .dash-header {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .dash-name { margin: 0 0 22px; color: var(--navy-900); }

  .holding-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 5px;
    margin-bottom: 8px;
    font-family: Arial, sans-serif;
  }
  .holding-ticker { font-weight: bold; color: var(--navy-900); font-size: 14px; }
  .holding-price { text-align: right; }
  .holding-price .price { font-size: 14px; font-weight: bold; }
  .holding-price .change { font-size: 12px; }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .change.unknown { color: var(--muted); }

  .empty-portfolio {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    padding: 14px 0;
  }
</style>
</head>
<body data-page="home">

<div id="eppn-nav-root"></div>

<div class="eppn-page">
  <div class="eppn-container" id="page-content">
    <!-- filled in by script below -->
    <p class="eppn-spinner-note" style="text-align:center; padding-top:40px;">Loading…</p>
  </div>
</div>

<script src="eppn-common.js"></script>
<script>
async function renderPage() {
  const content = document.getElementById('page-content');

  if (!EPPN.isLoggedIn()) {
    content.innerHTML = `
      <div class="hero">
        <h1>The Portfolio Briefcase</h1>
        <div class="slogan">Your Portfolio. Your News. Every Morning.</div>
        <a href="subscribe.html" class="eppn-btn">Subscribe</a>
        <a href="login.html" class="login-hint">Log in</a>
      </div>
    `;
    return;
  }

  const email = EPPN.getEmail();

  try {
    const [portfolioRes, quotesRes] = await Promise.all([
      fetch(`${EPPN.API_BASE}/get-portfolio?email=${encodeURIComponent(email)}`),
      fetch(`${EPPN.API_BASE}/portfolio-quotes?email=${encodeURIComponent(email)}`)
    ]);

    if (!portfolioRes.ok) throw new Error('Could not load subscriber record');

    const portfolioData = await portfolioRes.json();
    const quotesData = quotesRes.ok ? await quotesRes.json() : { quotes: [] };
    const quoteMap = {};
    (quotesData.quotes || []).forEach(q => { quoteMap[q.ticker] = q; });

    const tickers = (portfolioData.portfolio || '')
      .split(',')
      .map(t => t.trim())
      .filter(Boolean);

    let holdingsHtml = '';
    if (tickers.length === 0) {
      holdingsHtml = `<div class="empty-portfolio">Your portfolio is empty — add some tickers to start getting news.</div>`;
    } else {
      holdingsHtml = tickers.map(ticker => {
        const q = quoteMap[ticker];
        const display = ticker.includes(':') ? ticker.split(':').pop() : ticker;
        let priceHtml;
        if (q && q.price != null) {
          const dir = q.pct_change >= 0 ? 'up' : 'down';
          const arrow = q.pct_change >= 0 ? '▲' : '▼';
          priceHtml = `
            <div class="price">$${q.price}</div>
            <div class="change ${dir}">${arrow} ${Math.abs(q.pct_change)}%</div>
          `;
        } else {
          priceHtml = `<div class="change unknown">price unavailable</div>`;
        }
        return `
          <div class="holding-row">
            <div class="holding-ticker">${display}</div>
            <div class="holding-price">${priceHtml}</div>
          </div>
        `;
      }).join('');
    }

    content.innerHTML = `
      <div class="dash-header">Welcome back</div>
      <h1 class="dash-name">${portfolioData.name || 'Your portfolio'}</h1>
      ${holdingsHtml}
      <a href="edit-portfolio.html" class="eppn-btn" style="margin-top:18px;">Edit portfolio</a>

      <div class="eppn-disclaimers">
        <p><strong>Educational content only.</strong> This is general market information, not financial advice, and nothing here is a recommendation to buy, sell, or hold any investment.</p>
        <p><strong>Third-party pricing.</strong> Prices and % changes shown here are pulled from a third-party data provider and may be delayed, incomplete, or occasionally inaccurate.</p>
        <p><strong>No advisory relationship.</strong> The Portfolio Briefcase is not a registered investment advisor and does not act in a fiduciary capacity for subscribers.</p>
      </div>
    `;
  } catch (err) {
    console.error(err);
    content.innerHTML = `
      <div class="eppn-status err" style="display:block;">
        We couldn't load your portfolio. Your session may be out of date —
        try <a href="login.html">logging in</a> again.
      </div>
    `;
  }
}

document.addEventListener('DOMContentLoaded', renderPage);
</script>

</body>
</html>
